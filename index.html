<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дино Игра</title>
  <link rel="stylesheet" href="game.css" />
</head>
<body>

  <div id="score">Очки: 0</div>
  <div id="game">
    <img id="dino" src="dino.png" alt="Динозавр" />
    <img id="obstacle" src="cactus.png" alt="Кактус" />
  </div>

  <audio id="bg-music" src="https://files.catbox.moe/c6uajo.mp3" preload="auto" loop></audio>
  
  <!-- Кнопка управления музыкой -->
  <button id="music-toggle" onclick="toggleMusic()">Включить музыку</button>
  
  <!-- Индикатор состояния музыки -->
  <div id="music-status">Музыка: Выключена</div>

  <script src="game.js"></script>
</body>
</html>
